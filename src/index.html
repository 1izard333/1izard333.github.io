<body>
    <h1>solar system sim</h1>
    <p class="subtitle">
        drag to rotate, click a planet to zoom, slide to control time
    </p>

    <canvas id="glcanvas" width="600" height="600"></canvas>

    <div class="controls">
        <div id="planetButtons"></div>
        <div style="margin-top: 10px;">
            Simulation speed:
            <input type="range" id="speedSlider" min="0" max="1000" step="1" value="30">
            <span id="speedValue">30</span> days/sec
        </div>
    </div>

    <!-- Lighting Sliders -- all objects -->
    <div style="margin-top: 10px;">
         Ambient ka:
        <input type="range" id="kaSlider" min="0" max="1" step="0.01" value="0.3">
        <span id="kaValue">per-object</span>
    </div>
        <div style="margin-top: 6px;">
            Diffuse kd:
            <input type="range" id="kdSlider" min="0" max="1.5" step="0.01" value="0.85">
            <span id="kdValue">per-object</span>
        </div>
        <div style="margin-top: 6px;">
            Specular ks:
            <input type="range" id="ksSlider" min="0" max="1.5" step="0.01" value="0.5">
            <span id="ksValue">per-object</span>
        </div>
        <div style="margin-top: 6px;">
            Shininess:
            <input type="range" id="shineSlider" min="1" max="256" step="1" value="40">
            <span id="shineValue">per-object</span>
        </div>
        <div style="margin-top: 6px;">
            Metallic:
            <input type="range" id="metalSlider" min="0" max="1" step="0.01" value="0">
            <span id="metalValue">per-object</span>
        </div>

    <!-- Vertex shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
        in vec3 aPosition; 
        in vec3 aColor; 
        in vec3 aNormal; // surface normal in shapes 
        
        uniform float uTime; //time in sec 
        uniform mat4 uModelViewMatrix; 
        uniform mat4 uProjectionMatrix; 
        uniform mat4 uModelTransformationMatrix; 
        uniform mat3 uNormalMatrix;
        
        out vec3 vColor;
        out vec3 vLensPosition;
        out vec3 vNormalLens;
        
        void main() { 
            // position matrix of the view point
            vec4 posLens = uModelViewMatrix * uModelTransformationMatrix * vec4(aPosition,1.0); 
            vLensPosition = posLens.xyz; // drop the last val
            vNormalLens = normalize(uNormalMatrix * aNormal);
            gl_Position = uProjectionMatrix * posLens; 
            vColor = aColor;
        }

        </script>

        <!-- Fragment Shader -->
        <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es 
            precision highp float; 
            
            in vec3 vColor; 
            in vec3 vLensPosition;
            in vec3 vNormalLens;
            out vec4 fragColor; 

            struct Material {
                float ka;            // ambient
                float kd;            // diffuse
                float ks;            // specular
                float shininess;     // phong exp
                float metallic;      // 
                float emissive;      // 
            };

            uniform Material uMaterial;
            uniform bool uFlatShading;

            // lights -- in view (lens) coordinates
            const int NUM_LIGHTS = 2;
            uniform vec4 uLightPos[NUM_LIGHTS];   // w = 1 point light, w = 0 parallel (direction toward light)
            uniform vec3 uLightColor[NUM_LIGHTS]; // I_L, color * intensity
            uniform vec3 uLightAtt[NUM_LIGHTS];   // (a, b, c) -> f_att = 1 / (a + b d + c d^2)
            uniform vec3 uAmbient;                // I_a

            // diffuse + specular for one light
            vec3 calculateLight(vec4 lightPos, vec3 lightColor, vec3 att,
                                vec3 normal, vec3 viewDir, vec3 base, vec3 specColor) {
                vec3 lightDir;   // l, toward the light
                float fAtt = 1.0;
                if (lightPos.w == 0.0) {
                    lightDir = normalize(lightPos.xyz);                 // parallel light
                } else {
                    vec3 toLight = lightPos.xyz - vLensPosition;        // point light
                    float d = length(toLight);
                    lightDir = toLight / d;
                    fAtt = 1.0 / (att.x + att.y * d + att.z * d * d);  // attenuation
                }

                // diffuse: Kd * max(0, n . l)
                float cosTheta = max(dot(normal, lightDir), 0.0);
                vec3 diffuse = uMaterial.kd * cosTheta * base;

                // specular: Ks * max(0, v . r)^alpha,  r = 2(l . n)n - l
                vec3 specular = vec3(0.0);
                if (cosTheta > 0.0) {
                    vec3 reflectDir = -reflect(lightDir, normal);
                    float spec = pow(max(dot(viewDir, reflectDir), 0.0), uMaterial.shininess);
                    specular = uMaterial.ks * spec * specColor;
                }

                return fAtt * lightColor * (diffuse + specular);
            }
            
            void main() { 
                // normal -- flat uses the triangle's face normal, smooth uses interpolated normal
                vec3 normal;
                if (uFlatShading) {
                    normal = normalize(cross(dFdx(vLensPosition), dFdy(vLensPosition)));
                } else {
                    normal = normalize(vNormalLens);
                }

                // ortho camera -> view direction is +z everywhere
                vec3 viewDir = vec3(0.0, 0.0, 1.0);

                vec3 base = vColor;
                vec3 specColor = mix(vec3(1.0), base, uMaterial.metallic);

                vec3 emissive = uMaterial.emissive * base;      // sun + orbits glow
                vec3 ambient = uMaterial.ka * uAmbient * base;  // I_a * Ka, once

                // I_final = I_a Ka + sum of each light
                vec3 result = emissive + ambient;
                for (int i = 0; i < NUM_LIGHTS; i++) {
                    result += calculateLight(uLightPos[i], uLightColor[i], uLightAtt[i],
                                             normal, viewDir, base, specColor);
                }

                fragColor = vec4(result,1.0); 
            }
        </script>

    <script src="primitives.js"></script>
    <script src="transformations.js"></script>
    <script src="planet.js"></script>
    <script src="prism.js"></script>
    <script src="sat.js"></script>
    <script src="orbit.js"></script>
    <script src="scene.js"></script>
    <script src="data.js"></script>
    <script src="displayScale.js"></script>
    <script src="material.js"></script>

    

    <script>
        function createShader(gl, type, source) {
            let shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                throw new Error(gl.getShaderInfoLog(shader));
            }
            return shader;
        }

        function createProgram(gl, vsSource, fsSource) {
            let vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
            let fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            let prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                throw new Error(gl.getProgramInfoLog(prog));
            }
            return prog;
        }

        // WebGL setup
        const canvas = document.getElementById("glcanvas");
        const gl = canvas.getContext("webgl2");
        if (!gl) alert("WebGL2 not supported");

        const vertSource = document.getElementById("vertex-shader").textContent;
        const fragSource = document.getElementById("fragment-shader").textContent;

        let program, posLoc, colorLoc, timeLoc, uMVM, uPM, uMTM;

        //variables for lighting
        let normalLoc, uNM, uFlat, uLightPosLoc, uLightColorLoc, uLightAttLoc, uAmbientLoc;
        const uMat = {}; 

        // function to place shapes 
        function makeShapeBuffers(shape, mode = gl.TRIANGLES) {
            const vbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.bufferData(gl.ARRAY_BUFFER, shape.positions, gl.STATIC_DRAW);

            const cbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, cbo);
            gl.bufferData(gl.ARRAY_BUFFER, shape.colors, gl.STATIC_DRAW);

            const ibo = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, shape.indices, gl.STATIC_DRAW);

            const nbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, nbo);
            gl.bufferData(gl.ARRAY_BUFFER, shape.normals, gl.STATIC_DRAW);

            return { vbo, cbo, ibo, nbo, count: shape.indices.length, mode : mode};
        }

        // build the scene & call the makeShapeBuffer for all hierchy parts
        const scene = buildScene();

        // functionallity to zoom into planet
        let zoomIndex = null; // no planet selected --> viewing whole system

        const buttonBox = document.getElementById("planetButtons")

        // zoom OUT button
        const zoomOutButton = document.createElement("button");
        zoomOutButton.textContent = "Full Solar System View";
        zoomOutButton.onclick = function() {zoomIndex = null;};
        buttonBox.appendChild(zoomOutButton);

        // function to alter ortho size 
        function makeOrtho(size){
            return matMul(
                box2Cube(-size * aspect, size * aspect, -size, size, zNear, zFar), flipZ());
        }

        // create one button per planet
        for(let i = 0; i < PLANETS.length; i++){
            const button = document.createElement("button");
            button.textContent = PLANETS[i].name;
            button.onclick = function(){zoomIndex = i;};
            buttonBox.appendChild(button);
        }

        let modelViewMatrix = mat4Identity();

        // send material info to shader
        function setMaterial(m) {
            gl.uniform1f(uMat.ka, m.ka);
            gl.uniform1f(uMat.kd, m.kd);
            gl.uniform1f(uMat.ks, m.ks);
            gl.uniform1f(uMat.shininess, m.shininess);
            gl.uniform1f(uMat.metallic, m.metallic);
            gl.uniform1f(uMat.emissive, m.emissive);
            gl.uniform1i(uFlat, m.flat ? 1 : 0);
        }

        // draw one shape with its own model matrix
        function drawShape(buffers, modelMatrix, material) {
            gl.uniformMatrix4fv(uMTM, false, modelMatrix);

            const mv = multiplyMat4(modelViewMatrix, modelMatrix);
            gl.uniformMatrix3fv(uNM, false, normalMat(mv));
            setMaterial(material);

            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.vbo);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.cbo);
            gl.enableVertexAttribArray(colorLoc);
            gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.nbo);
            gl.enableVertexAttribArray(normalLoc);
            gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.ibo);
            gl.drawElements(buffers.mode, buffers.count, gl.UNSIGNED_SHORT, 0);
        }


        function initShaderProgram() {
            try {
                program = createProgram(gl, vertSource, fragSource);
                gl.useProgram(program);
                posLoc = gl.getAttribLocation(program, "aPosition");
                colorLoc = gl.getAttribLocation(program, "aColor");
                timeLoc = gl.getUniformLocation(program, "uTime");
                uMVM = gl.getUniformLocation(program, "uModelViewMatrix");
                uPM = gl.getUniformLocation(program, "uProjectionMatrix");
                uMTM = gl.getUniformLocation(program, "uModelTransformationMatrix");
                normalLoc = gl.getAttribLocation(program, "aNormal");
                uNM = gl.getUniformLocation(program, "uNormalMatrix");
                uFlat = gl.getUniformLocation(program, "uFlatShading");
                uLightPosLoc = gl.getUniformLocation(program, "uLightPos");
                uLightColorLoc = gl.getUniformLocation(program, "uLightColor");
                uLightAttLoc = gl.getUniformLocation(program, "uLightAtt");
                uAmbientLoc = gl.getUniformLocation(program, "uAmbient");
                for (const field of ["ka", "kd", "ks", "shininess", "metallic", "emissive"]) {
                    uMat[field] = gl.getUniformLocation(program, "uMaterial." + field);
                }
            } catch (e) {
                console.error(e);
            }
        }
        initShaderProgram();
        // Mouse and keyboard interactions
        let mouseDown = false,
            lastX, lastY, objectRotX = 0,
            objectRotY = 0;
        let camX = 0,
            camY = 0,
            camZ = -50;

        canvas.addEventListener('mousedown', e => {
            mouseDown = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('mousemove', e => {
            if (!mouseDown) return;
            let dx = e.clientX - lastX;
            let dy = e.clientY - lastY;
            objectRotY += dx * 0.01;
            objectRotX += dy * 0.01;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        document.addEventListener('keydown', e => {
            const step = 0.2;
            switch (e.key) {
                case 'ArrowUp':
                    camY -= step;
                    break;
                case 'ArrowDown':
                    camY += step;
                    break;
                case 'ArrowLeft':
                    camX += step;
                    break;
                case 'ArrowRight':
                    camX -= step;
                    break;
                case 'w':
                    camZ += step;
                    break;
                case 's':
                    camZ -= step;
                    break;
            }
        });


        // Projection setup
        let fov = Math.PI / 4,
            aspect = canvas.width / canvas.height,
            zNear = 0.1,
            zFar = 110;

        let orthoSize = 40;

        // Perspective and Orthographic projection
        let projPerspective = perspective(fov, aspect, zNear, zFar);

        let projOrtho = matMul(
            box2Cube(-orthoSize * aspect, orthoSize * aspect, -orthoSize, orthoSize, zNear, zFar),
            flipZ()
        );
        let proj = projOrtho;

        let startTime = Date.now();

        // create a simulation clock --> days per second
        let daysPerSecond = 30;
        let day = 0;
        let past = Date.now();
        const satOrbitDays = 20; 
        const panelSpinDays = 40; 

        // slider to adjust simulated time speed
        const speedSlider = document.getElementById("speedSlider");
        const speedValue = document.getElementById("speedValue");

        speedSlider.oninput = function(){
            daysPerSecond = parseFloat(speedSlider.value);
            speedValue.textContent = daysPerSecond;
        };

        
        // =====================================================================
        // HW4: lighting + satellite settings (fixed values for now — no UI hooked up)
        // =====================================================================
 
        // satellite motion
        const satMotion = {
            periodDays: 20,        // how long one trip around the planet takes
            inclinationDeg: 0,     // tilt of the satellite's orbit plane
            panelAuto: true,       // panels spin on their own
        };
        // Angles are ACCUMULATED each frame (instead of day / period) so that
        // changing the period later doesn't make the satellites teleport.
        let satPhase = 0;          // radians
        let panelPhase = 0;        // radians
 
        const lights = {
            sun:  { on: true, color: [1.0, 0.94, 0.82], intensity: 1.2, falloff: 0.0008 },
            fill: { on: true, color: [0.55, 0.68, 1.0], intensity: 0.3, azimuth: -40, elevation: 30 },
            ambient: 0.25,
        };
 
        // =====================================================================
        // HW4: material sliders — they edit the one shared MATERIAL (materials.js),
        // which every planet and the satellite use, so each slider changes everything.
        // (The Sun and orbit lines use their own unlit materials and aren't affected.)
        // =====================================================================
        function materialSlider(sliderId, valueId, field) {
            const slider = document.getElementById(sliderId);
            const label = document.getElementById(valueId);
            slider.value = MATERIAL[field];        // start at the material's value
            label.textContent = MATERIAL[field];
            slider.oninput = function(){
                MATERIAL[field] = parseFloat(slider.value);
                label.textContent = slider.value;
            };
        }
        materialSlider("kaSlider",    "kaValue",    "ka");
        materialSlider("kdSlider",    "kdValue",    "kd");
        materialSlider("ksSlider",    "ksValue",    "ks");
        materialSlider("shineSlider", "shineValue", "shininess");
        materialSlider("metalSlider", "metalValue", "metallic");
 
        // =====================================================================
        // HW4: send both lights to the shader (once per frame)
        // =====================================================================
        function setLights(sunModelMatrix) {
            // Light 1 — the Sun: a POINT light (w = 1) at the Sun's center.
            // It's attached to the scene, so push its center through the Sun's
            // model matrix and the camera matrix to get its eye-space position.
            const sunEye = mat4TransformPoint(multiplyMat4(modelViewMatrix, sunModelMatrix), [0, 0, 0]);
 
            // Light 2 — fill: a DIRECTIONAL light (w = 0) given straight in eye
            // space, so it's attached to the camera. Azimuth/elevation -> unit vector.
            const az = lights.fill.azimuth * Math.PI / 180;
            const el = lights.fill.elevation * Math.PI / 180;
            const fillDir = [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
 
            const s = lights.sun.on ? lights.sun.intensity : 0;    // "off" = zero brightness
            const f = lights.fill.on ? lights.fill.intensity : 0;
 
            gl.uniform4fv(uLightPosLoc, [
                sunEye[0], sunEye[1], sunEye[2], 1,
                fillDir[0], fillDir[1], fillDir[2], 0,
            ]);
            gl.uniform3fv(uLightColorLoc, [
                lights.sun.color[0] * s, lights.sun.color[1] * s, lights.sun.color[2] * s,
                lights.fill.color[0] * f, lights.fill.color[1] * f, lights.fill.color[2] * f,
            ]);
            // f_att = 1 / (a + b d + c d^2): sun uses a = 1, b = 0, c = falloff slider; fill light: none
            gl.uniform3fv(uLightAttLoc, [1, 0, lights.sun.falloff,   1, 0, 0]);
            gl.uniform3f(uAmbientLoc, lights.ambient, lights.ambient, lights.ambient);
        }



        function render() {

            // calculate days passing being simulated 
            const now = Date.now();
            const dt = (now - past)/1000 //change in time in seconds
            past = now;
            day = day + (dt * daysPerSecond);


            gl.enable(gl.DEPTH_TEST);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            // rotation matrices
            let cx = Math.cos(objectRotY),
                sx = Math.sin(objectRotY);
            let cy = Math.cos(objectRotX),
                sy = Math.sin(objectRotX);
            let rotX = [1, 0, 0, 0, 0, cy, sy, 0, 0, -sy, cy, 0, 0, 0, 0, 1];
            let rotY = [cx, 0, -sx, 0, 0, 1, 0, 0, sx, 0, cx, 0, 0, 0, 0, 1];
            let objectRotation = multiplyMat4(rotY, rotX);

            // init model-view matrix as identity matrix
            modelViewMatrix = mat4Identity();
            // init model transformation matrix as identity matrix
            let modelTransformationMatrix = mat4Identity();

            //delta time in ms
            let deltaTime = Date.now() - startTime;
            // object rotation
            modelTransformationMatrix = multiplyMat4(modelTransformationMatrix, objectRotation);
        

            // loop through planets and draw the planet & orbit
            // apply matrix transformation to all for correct translation

            const planetMatrices = [];
            for(let i = 0; i < scene.planets.length; i++){
                const planet = scene.planets[i];

                // create planet orbiting 
                const angle = (day / planet.data.orbitPeriod) * 2 * Math.PI;
                let planetMatrix = mat4RotateY(objectRotation, angle);

                // translate planet by distance scaling and draw
                planetMatrix = mat4Translate(planetMatrix, [displayDistance(planet.data), 0, 0]);
                planetMatrices.push(planetMatrix);
            }

            // create one satellite per planetr
            const satMatrices = [];
            const panelMatrices = [];
            for(let i = 0; i < scene.planets.length; i++){
                const planetRadius = displayRadius(scene.planets[i].data);

                // create orbit for sat
                const satAngle = (day / satOrbitDays) * 2 * Math.PI;
                let satMatrix = mat4RotateY(planetMatrices[i], satAngle);      
                satMatrix = mat4Translate(satMatrix, [planetRadius * 2, 0, 0]); // orbit at 2x radius
                satMatrix = mat4Scale(satMatrix, [planetRadius * 0.15, planetRadius * 0.15, planetRadius * 0.15]); // scale sat to planet
                satMatrices.push(satMatrix);

                // add solar panels, both kleft & right
                const panelAngle = (day / panelSpinDays) * 2 * Math.PI;
                let leftPanel = mat4Translate(satMatrix, [-1.25, 0, 0]); // offset from body
                leftPanel = mat4RotateX(leftPanel, panelAngle); //rotate

                let rightPanel = mat4Translate(satMatrix, [1.25, 0, 0]);
                rightPanel = mat4RotateX(rightPanel, panelAngle);

                panelMatrices.push([leftPanel, rightPanel]);
            }

            // default to center
            let lookX = 0, lookY = 0, lookZ = 0;
            let viewSize = orthoSize;

            // if planet selected
            if(zoomIndex !== null){
                const m = planetMatrices[zoomIndex];
                // translation valus of matrix
                lookX = m[12];
                lookY = m[13];
                lookZ = m[14];

                // make ortho value fit 3x the radius
                viewSize = displayRadius(scene.planets[zoomIndex].data) * 3;
            }

            // move so planet in center of screen
            modelViewMatrix = mat4Translate(modelViewMatrix, [camX - lookX, camY - lookY, camZ - lookZ]);
            proj = makeOrtho(viewSize);

            //set time in seconds
            gl.uniform1f(timeLoc, deltaTime / 1000.0);
            gl.uniformMatrix4fv(uPM, false, proj);
            gl.uniformMatrix4fv(uMVM, false, modelViewMatrix);
            setLights(objectRotation); // send lights after camera is set

            // draw root -> sun in the center
            drawShape(scene.sun.sphere, objectRotation, scene.sun.material);

            // draw planet + orbit + sat
            for(let i = 0; i < scene.planets.length; i++){
                const planet = scene.planets[i];
                drawShape(planet.orbit, objectRotation, scene.orbitMaterial);
                drawShape(planet.sphere, planetMatrices[i], planet.material);
                drawShape(scene.satBody, satMatrices[i], scene.satBodyMaterial);
                drawShape(scene.satPanel, panelMatrices[i][0], scene.satPanelMaterial);
                drawShape(scene.satPanel, panelMatrices[i][1], scene.satPanelMaterial);
            }

        }

        // Initialize when page loads
        window.onload = function() {
            setInterval(render, 30);
        }
    </script>
